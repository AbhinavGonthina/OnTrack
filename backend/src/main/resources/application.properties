spring.application.name=OnTrack

# --- Database (Neon Postgres) ---
# Set these via environment variables, never hardcode real values here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate must never auto-generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Gemini ---
app.gemini.api-key=${GEMINI_API_KEY}

# --- Actuator ---
# Health endpoint must stay DB-independent so cold-start polling from the
# frontend is cheap to hit repeatedly (see SPEC.md cold-start UX section).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false

# --- CORS (set once the Vercel frontend URL is known) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Rate limiting ---
app.ratelimit.requests-per-minute=20
