spring.application.name=OnTrack

# --- Server ---
# Render's Docker web services inject PORT at runtime and route to whatever
# the container listens on; default to 8080 for local/dev.
server.port=${PORT:8080}

# --- Database (Neon Postgres) ---
# Set these via environment variables, never hardcode real values here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate must never auto-generate/alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Gemini ---
# Pinned, not "-latest": that alias can silently repoint to whichever model Google just
# shipped, and free-tier daily quota is per-model - "-latest" landed on gemini-3.8-flash,
# which every other free-tier user hammers too, while flash-lite variants get a much higher
# daily cap (500/day vs 20) since they're cheaper for Google to serve. Plenty for this app's
# extract/normalize/score tasks, which don't need deep multi-step reasoning.
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-3.5-flash-lite

# --- Resume file upload ---
# Matches the 5MB limit shown in the upload UI; extracted text only ever lives in memory
# for the duration of the request (see ResumeFileExtractor) - never written to disk or a table.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Resend (transactional email) ---
app.resend.api-key=${RESEND_API_KEY}
app.resend.from-address=OnTrack <noreply@mail.abhinavgonthina.me>
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Feedback ---
# Where the "report a problem" quick action sends messages - deliberately read from an
# env var rather than hardcoded, so it never ends up in the frontend bundle.
app.feedback.recipient-email=${FEEDBACK_RECIPIENT_EMAIL}

# --- Auth tokens ---
app.auth.email-verification-expiry-hours=24
app.auth.password-reset-expiry-minutes=30

# --- Actuator ---
# Health endpoint must stay DB-independent so cold-start polling from the
# frontend is cheap to hit repeatedly (see SPEC.md cold-start UX section).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false

# --- CORS (set once the Vercel frontend URL is known) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Rate limiting ---
# General per-user/IP budget across every endpoint. 20 was too tight for legitimate
# multi-page browsing (e.g. dashboard <-> applications <-> profile fires several requests
# per round trip) - the AI (gemini-requests-per-day) and email (email-requests-per-hour)
# limits below are the ones actually guarding the costly operations, so this one can afford
# to be looser.
app.ratelimit.requests-per-minute=60
app.ratelimit.gemini-requests-per-day=20
app.ratelimit.email-requests-per-hour=5
