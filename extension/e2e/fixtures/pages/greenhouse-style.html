<!doctype html>
<!--
  Served by the e2e static server as a stand-in for a real job posting.
  Shaped like a Greenhouse-hosted page: schema.org JobPosting in a script tag,
  which is reader 2 in the pipeline, so the extension reads it without any
  network call to a board API.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Senior Backend Engineer at Nimbus Robotics</title>
    <meta property="og:site_name" content="Nimbus Robotics" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Senior Backend Engineer",
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Nimbus Robotics"
        },
        "datePosted": "2026-10-01",
        "employmentType": "FULL_TIME",
        "description": "<p>Nimbus Robotics builds autonomy software for warehouse fleets.</p><p>What you will do:</p><ul><li>Design and ship services that coordinate several thousand robots</li><li>Own reliability for the dispatch pipeline end to end</li><li>Mentor engineers joining the team</li></ul><p>What we are looking for:</p><ul><li>Five years building backend systems in production</li><li>Comfort with distributed systems and their failure modes</li><li>Experience with Java, Go or Rust</li></ul>"
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Senior Backend Engineer</h1>
      <p>Nimbus Robotics, Boston MA</p>
    </main>
  </body>
</html>
